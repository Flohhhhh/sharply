name: Prepare release preview

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

concurrency:
  group: prepare-release-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prepare-release:
    if: github.head_ref == 'development'
    runs-on: ubuntu-latest
    env:
      # drizzle.config.ts imports env validation even though generation is based
      # on the schema and migration snapshots.
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/sharply_generate
      SKIP_ENV_VALIDATION: "1"
    steps:
      - name: Check out development
        uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate canonical migration
        run: npm run db:generate

      - name: Commit generated migration if needed
        id: migration
        run: |
          if git diff --quiet -- drizzle/; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drizzle/
          git commit -m "chore(release): generate migrations for PR #${{ github.event.pull_request.number }}"
          git push origin HEAD:development
          echo "created=true" >> "$GITHUB_OUTPUT"

      # If a migration commit was pushed, GitHub emits a synchronize event and
      # this workflow runs again against that exact prepared development state.
      - name: Trigger Vercel release preview
        if: steps.migration.outputs.created == 'false'
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          test -n "$VERCEL_DEPLOY_HOOK_URL"
          curl --fail-with-body --silent --show-error --request POST "$VERCEL_DEPLOY_HOOK_URL"
