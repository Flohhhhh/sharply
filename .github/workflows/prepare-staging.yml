name: Prepare staging

on:
  push:
    branches:
      - staging

permissions:
  contents: write

concurrency:
  group: prepare-staging
  cancel-in-progress: false

jobs:
  prepare:
    # The prepared marker commit re-triggers this workflow; do not prepare twice.
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(staging): prepared') }}
    runs-on: ubuntu-latest
    env:
      # drizzle.config.ts imports env validation even though generate is schema/snapshot based.
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/sharply_generate
      SKIP_ENV_VALIDATION: "1"
    steps:
      - name: Check out staging
        uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate canonical migration
        run: npm run db:generate

      - name: Commit prepared staging state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drizzle/
          git commit --allow-empty -m "chore(staging): prepared ${GITHUB_SHA}"
          git push origin HEAD:staging
